name: Vagrant smoke

# Boots the Vagrant box that beaker-hostgenerator hands out for each platform
# below under libvirt. The normal test suite only checks the generated config,
# so a box that disappeared or stopped booting would otherwise go unnoticed
# until someone tried to use it.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/vagrant-smoke.yml
      - .github/scripts/vagrant-smoke.sh
      # Box mappings: a PR that changes them should show whether the boxes boot
      - lib/beaker-hostgenerator/hypervisor/vagrant.rb

permissions:
  contents: read

jobs:
  smoke:
    # The nightly schedule only runs upstream. Pull requests and manual runs
    # also work in forks, e.g. to try box changes before opening a PR.
    if: github.event_name != 'schedule' || github.repository_owner == 'voxpupuli'
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One broken box must not hide the others
      fail-fast: false
      matrix:
        # <os>-64 platforms that map to a Vagrant box. Add a platform here when
        # support for a new one is added to the Vagrant hypervisor.
        platform:
          - almalinux9-64
          - almalinux10-64
          - amazon2023-64
          - centos9-64
          - centos10-64
          - debian12-64
          - debian13-64
          - fedora42-64
          - fedora43-64
          - oracle9-64
          - oracle10-64
          - rocky9-64
          - rocky10-64
          - ubuntu2204-64
          - ubuntu2404-64
          - ubuntu2604-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby 4.0
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install libvirt and Vagrant
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          # Keep recommends: they bring in libvirt's QEMU driver and default network
          sudo apt-get install -y \
            acl build-essential dnsmasq-base libkrb5-dev libvirt-clients libvirt-daemon-system \
            libvirt-dev libxml2-dev libxslt1-dev pkg-config qemu-system-x86 qemu-utils \
            ruby-dev vagrant zlib1g-dev
          vagrant plugin install vagrant-libvirt
      - name: Allow the runner user to use libvirt
        # A group added with usermod only applies to new logins, so grant
        # access to the system socket directly
        run: sudo setfacl -m "user:$USER:rw" /var/run/libvirt/libvirt-sock
      - name: Boot ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/vagrant-smoke.sh "$PLATFORM"
